services:
  postgres:
    image: postgres:16-alpine
    container_name: escolachave-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: escolachave
      POSTGRES_PASSWORD: escolachave123
      POSTGRES_DB: escolachave
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
